header:
  version: 17

machine: qemux86-64
distro: poky

defaults:
  repos:
    patches:
      repo: this

repos:
  this:
    path: ""

local_conf_header:
  sstate_cache: |
    BB_HASHSERVE_UPSTREAM = "wss://hashserv.yoctoproject.org/ws"
    SSTATE_MIRRORS ?= "file://.* http://cdn.jsdelivr.net/yocto/sstate/all/PATH;downloadfilename=PATH"
    BB_HASHSERVE = "auto"
    BB_SIGNATURE_HANDLER = "OEEquivHash"
  cyclonedx: |
    INHERIT += "cyclonedx-export"
  # add freerdp as a test package, because we know from https://github.com/savoirfairelinux/meta-cyclonedx/pull/22#issuecomment-3022954966
  # that this fails
  freerdp: |
    CORE_IMAGE_EXTRA_INSTALL += "freerdp"
    PREFERRED_VERSION_freerdp = "2.11.7"
  # add curl as a test package, as a test case to ensure that CVE_PRODUCT is correctly split
  curl: |
    CORE_IMAGE_EXTRA_INSTALL += "curl"
